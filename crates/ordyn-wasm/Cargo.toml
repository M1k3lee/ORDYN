[package]
name = "ordyn-wasm"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ordyn-diagnostics = { path = "../ordyn-diagnostics" }
ordyn-ast = { path = "../ordyn-ast" }
ordyn-lexer = { path = "../ordyn-lexer" }
ordyn-parser = { path = "../ordyn-parser" }
ordyn-types = { path = "../ordyn-types" }
ordyn-effects = { path = "../ordyn-effects" }
ordyn-ir = { path = "../ordyn-ir" }
ordyn-guard = { path = "../ordyn-guard" }
ordyn-runtime = { path = "../ordyn-runtime" }
ordyn-red-lab = { path = "../ordyn-red-lab" }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
