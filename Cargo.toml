[workspace]
members = [
    "crates/ordyn-diagnostics",
    "crates/ordyn-ast",
    "crates/ordyn-lexer",
    "crates/ordyn-parser",
    "crates/ordyn-types",
    "crates/ordyn-effects",
    "crates/ordyn-ir",
    "crates/ordyn-guard",
    "crates/ordyn-runtime",
    "crates/ordyn-stdlib",
    "crates/ordyn-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["The ORDYN Authors"]
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
thiserror = "2.0"
miette = { version = "7.4", features = ["fancy"] }
clap = { version = "4.5", features = ["derive"] }
