name: Deploy ORDYN Challenge Demo to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Demo to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Deploy Demo to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: demo
          branch: gh-pages
