name: Release ORDYN Toolchain Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ordyn
            asset_name: ordyn-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: ordyn
            asset_name: ordyn-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ordyn
            asset_name: ordyn-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ordyn.exe
            asset_name: ordyn-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin ordyn

      - name: Package Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" package/
          cp README.md LICENSE package/
          tar -czf "${{ matrix.asset_name }}" -C package .
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset_name }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
