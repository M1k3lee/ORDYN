name: ORDYN High-Assurance CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Verify Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout Source Repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Check Lints (Clippy)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run Workspace Unit & Integration Test Suites
      run: cargo test --workspace --verbose

    - name: Run End-to-End Canonical Example Verification
      run: |
        cargo run --bin ordyn -- check examples/secure_banking_service.ordyn
        cargo run --bin ordyn -- verify examples/secure_banking_service.ordyn
        cargo run --bin ordyn -- build examples/secure_banking_service.ordyn
        cargo run --bin ordyn -- run examples/secure_banking_service.ordyn --function deposit --arg 100
        cargo run --bin ordyn -- package examples/secure_banking_service.ordyn
        cargo run --bin ordyn -- inspect examples/secure_banking_service.ordyn-pkg
        cargo run --bin ordyn -- visual examples/secure_banking_service.ordyn
